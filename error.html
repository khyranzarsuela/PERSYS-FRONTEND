<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Error | PERSYS</title>
 <script>
  const persysBase =
    location.hostname === "localhost" ||
    location.hostname === "127.0.0.1"
      ? "/PERSYS-FRONTEND"
      : "";

  // Ensure all resources resolve from the frontend root.
  const baseElement = document.createElement("base");
  baseElement.href = `${location.origin}${persysBase}/`;
  document.head.appendChild(baseElement);
</script>

<link rel="stylesheet" href="styles/error.css">
<script src="scripts/apiConfig.js"></script>
<script src="scripts/error.js" defer></script>
</head>
<body>
  <main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <div class="brand">
        <!-- <span class="brand-mark"> -->
        <img class="brand-mark" src="assets/SAC logo.jpg" alt="Logo">
        <!-- </span> -->
        <div class="brand-text">
          <strong>PERSYS</strong>
          <span>Personnel Information Management System</span>
        </div>
      </div>

      <div class="illustration" aria-hidden="true">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>

        <div class="floating-document">
          <div class="document-top"></div>
          <div class="document-line line-long"></div>
          <div class="document-line line-short"></div>
          <div class="document-line line-medium"></div>
          <div class="document-symbol" id="document-symbol">?</div>
        </div>

        <div class="illustration-spark spark-one"></div>
        <div class="illustration-spark spark-two"></div>
        <div class="illustration-spark spark-three"></div>
      </div>

      <div class="error-content" role="status">
        <div class="error-label" id="error-label">SYSTEM NOTICE</div>
        <h1 class="error-code" id="error-code">404</h1>
        <h2 id="error-title">Page Not Found</h2>
        <p id="error-description">
          The page you're looking for couldn't be found.
        </p>
      </div>

      <div class="error-actions">
        <a class="btn btn-primary" id="primary-action"
          href="index.html">
          Back to Login
        </a>
        <a class="btn btn-secondary" id="secondary-action"
           href="Pages/Admin/adminDashboard.html">
          Go to Dashboard
        </a>
      </div>

      <p class="error-help">
        If the problem continues, please contact your system administrator.
      </p>

      <div class="card-footer">
        <span>BCSHS-SAC</span>
        <span class="footer-dot"></span>
        <span>PERSYS</span>
      </div>
    </section>
  </main>
</body>
</html>
