<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERSYS | Login</title>
   <link rel="icon" type="image/x-icon" href="assets/SAC logo.jpg">
  <link rel="stylesheet" href="styles/style.css" />
  
</head>
<body>

  <!-- ========================================================
       Login Page — Two-panel layout
       Left  : Form panel (white)
       Right : Illustration panel (purple)
  ======================================================== -->
  <main class="login-page">

    <!-- ── LEFT PANEL ──────────────────────────────────────── -->
    <section class="form-panel" aria-label="Login form">

      <!-- Brand / Logo -->
      <header class="brand">
        <!-- Simple SVG pin / location icon that mirrors the design mark -->
       <img class="brand-icon" src="assets/SAC logo.jpg" alt="">
        <span class="brand-name">BCSHS-SAC | PERSYS</span>
      </header>

      <!-- Login Form -->
      <div class="form-wrapper">
        <h1 class="form-title">Login</h1>
        <p class="form-subtitle">Welcome to PERSYS! Login to continue.</p>
        
        <div style="color: red; margin-bottom: 15px; font-weight: bold;"></div>
        <!-- Login error message: JavaScript controls visibility and text -->
        <div id="loginMessage" class="login-message" role="alert" aria-live="polite" hidden></div>

        <form id="loginForm" class="login-form" novalidate>


          <!-- Login field -->
          <div class="field-group" id="loginGroup">
            <label class="field-label" for="login">Email or Username</label>
           <input
              type="text"
              class="field-input"
              name="login"
              id="login"
              placeholder="Email or Username"
              autocomplete="username"
              required>

            <!-- Inline error message (hidden by default) -->
            <span class="field-error" id="loginError" role="alert"></span>
          </div>

          <!-- Password field -->
          <div class="field-group" id="passwordGroup">
            <label class="field-label" for="password">Password</label>
            <div class="password-wrapper">
              <input
                class="field-input"
                type="password"
                id="password"
                name="password"
                placeholder="••••••••••••••••••••"
                autocomplete="current-password"
                required
              />
              <!-- Show / hide password toggle -->
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Toggle password visibility"
                aria-pressed="false"
              >
                <!-- Eye-off icon (default — password hidden) -->
                <svg class="eye-icon eye-off" viewBox="0 0 24 24" fill="none"
                     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20
                           C7 20 2.73 16.11 1 12
                           c.75-1.8 1.98-3.37 3.52-4.56
                           M9.9 4.24A9.12 9.12 0 0 1 12 4
                           c5 0 9.27 3.89 11 8
                           a10.15 10.15 0 0 1-1.67 2.67"
                        stroke="#9CA3AF" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M1 1l22 22" stroke="#9CA3AF" stroke-width="2"
                        stroke-linecap="round"/>
                  <path d="M10.73 10.73A3 3 0 0 0 14.83 14.83"
                        stroke="#9CA3AF" stroke-width="2"
                        stroke-linecap="round"/>
                </svg>
                <!-- Eye icon (password visible) -->
                <svg class="eye-icon eye-on" viewBox="0 0 24 24" fill="none"
                     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M1 12C2.73 7.89 7 4 12 4s9.27 3.89 11 8
                           c-1.73 4.11-6 8-11 8S2.73 16.11 1 12Z"
                        stroke="#6A0DAD" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3"
                          stroke="#6A0DAD" stroke-width="2"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="passwordError" role="alert"></span>
          </div>

          <!-- Remember me + Forgot password row -->
          <div class="form-options">
            <label class="remember-label">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span class="custom-checkbox" aria-hidden="true"></span>
              Remember me
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Submit button -->
          <button type="submit" class="btn-login" name="btn-login">Login</button>

        </form>
      </div>

    </section>
    <!-- ── END LEFT PANEL ───────────────────────────────────── -->

    <!-- ── RIGHT PANEL ─────────────────────────────────────── -->
   
<!-- RIGHT PANEL — IMAGE CAROUSEL -->
<section class="illustration-panel" aria-label="BCSHS-SAC school highlights">

    <div class="login-carousel" id="loginCarousel">

        <!-- Carousel images -->
        <div class="carousel-images" aria-hidden="true">
            <img
                src="assets/login-images/login-page1.jpg"
                class="carousel-image is-active"
                alt=""
                fetchpriority="high"
            >

            <img
                src="assets/login-images/login-page2.jpg"
                class="carousel-image"
                alt=""
                loading="lazy"
            >

            <img
                src="assets/login-images/login-page3.jpg"
                class="carousel-image"
                alt=""
                loading="lazy"
            >

            <img
                src="assets/login-images/login-page4.jpg"
                class="carousel-image"
                alt=""
                loading="lazy"
            >
        </div>

        <!-- Purple gradient overlay -->
        <div class="carousel-overlay" aria-hidden="true"></div>

        <!-- Banner information -->
        <div class="carousel-content">
            <span class="carousel-eyebrow">BCSHS-SAC</span>

            <h2>Welcome to PERSYS</h2>

            <p>
                Personnel Information Management System
            </p>
        </div>

        <!-- Carousel controls -->
        <div class="carousel-controls">
            <div class="carousel-indicators" aria-label="Choose banner image">
                <button type="button" class="carousel-dot is-active"
                        aria-label="Show image 1" aria-pressed="true"></button>
                <button type="button" class="carousel-dot"
                        aria-label="Show image 2" aria-pressed="false"></button>
                <button type="button" class="carousel-dot"
                        aria-label="Show image 3" aria-pressed="false"></button>
                <button type="button" class="carousel-dot"
                        aria-label="Show image 4" aria-pressed="false"></button>
            </div>

            <button type="button"
                    id="carouselPause"
                    class="carousel-pause"
                    aria-label="Pause image carousel"
                    aria-pressed="false">
                Pause
            </button>
        </div>

    </div>

</section>

    <!-- ── END RIGHT PANEL ──────────────────────────────────── -->

  </main>
  <script src="scripts/apiConfig.js"></script>
  <script src="scripts/index.js"></script>
</body>
</html>
